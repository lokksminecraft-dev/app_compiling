name: Compilar APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Criar projeto
        run: |
          set -e
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' << 'ARQUIVO_FIM'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.ocarina"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.ocarina"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          ARQUIVO_FIM
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' << 'ARQUIVO_FIM'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:label="Ocarina Controller"
                  android:theme="@android:style/Theme.DeviceDefault">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".OcarinaService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />

                  <service
                      android:name=".TapService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          ARQUIVO_FIM
          mkdir -p "$(dirname 'app/src/main/java/com/example/ocarina/MainActivity.kt')"
          cat > 'app/src/main/java/com/example/ocarina/MainActivity.kt' << 'ARQUIVO_FIM'
          package com.example.ocarina

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private val h = Handler(Looper.getMainLooper())

              private val atualizar = object : Runnable {
                  override fun run() {
                      val acess = if (TapService.instance != null) "ativa" else "INATIVA"
                      status.text = "Acessibilidade: $acess\nNota: ${OcarinaService.ultimaNota}\n${OcarinaService.debug}"
                      h.postDelayed(this, 150)
                  }
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val ll = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 48, 48, 48)
                  }
                  status = TextView(this).apply { textSize = 18f }

                  fun botao(t: String, f: () -> Unit) {
                      ll.addView(Button(this).apply { text = t; setOnClickListener { f() } })
                  }

                  botao("1. Ativar acessibilidade") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  botao("2. Calibrar botões (começa em 10 s)") {
                      val s = TapService.instance
                      if (s == null) {
                          Toast.makeText(this, "Ative o serviço de acessibilidade primeiro", Toast.LENGTH_LONG).show()
                      } else {
                          s.startCalibration(10_000)
                          Toast.makeText(this, "Abra o emulador AGORA, com os botões na tela", Toast.LENGTH_LONG).show()
                      }
                  }
                  botao("3. Iniciar ocarina") { iniciar() }
                  botao("Parar") { stopService(Intent(this, OcarinaService::class.java)) }
                  ll.addView(status)
                  setContentView(ll)
              }

              override fun onResume() { super.onResume(); h.post(atualizar) }
              override fun onPause() { super.onPause(); h.removeCallbacks(atualizar) }

              private fun iniciar() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO, "android.permission.POST_NOTIFICATIONS"), 1)
                  } else {
                      startForegroundService(Intent(this, OcarinaService::class.java))
                  }
              }

              override fun onRequestPermissionsResult(code: Int, perms: Array<out String>, res: IntArray) {
                  super.onRequestPermissionsResult(code, perms, res)
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) iniciar()
              }
          }
          ARQUIVO_FIM
          mkdir -p "$(dirname 'app/src/main/java/com/example/ocarina/OcarinaService.kt')"
          cat > 'app/src/main/java/com/example/ocarina/OcarinaService.kt' << 'ARQUIVO_FIM'
          package com.example.ocarina

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaRecorder
          import android.os.Build
          import android.os.IBinder
          import kotlin.math.PI
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.sqrt

          class OcarinaService : Service() {

              companion object {
                  // Ré, Fá, Lá, Si, Ré agudo  ->  A, C-Baixo, C-Direita, C-Esquerda, C-Cima
                  val BASE = doubleArrayOf(293.66, 349.23, 440.00, 493.88, 587.33)

                  // Ocarina de 12 furos Alto C (a mais comum): 2.0 (soa uma oitava acima da notação do N64).
                  // Se a sua soar nas frequências de BASE, use 1.0. Veja a nota detectada na tela do app.
                  const val OITAVA = 2.0

                  const val SR = 44100
                  const val BLOCO = 2048          // ~46 ms
                  const val VOLUME_MIN = 0.01     // sobe se pegar ruído, desce se não detectar
                  const val PUREZA_MIN = 0.5      // quão "limpa" precisa ser a nota (0 a 1)

                  val NOMES = arrayOf("A (Ré)", "C-Baixo (Fá)", "C-Direita (Lá)", "C-Esquerda (Si)", "C-Cima (Ré agudo)")

                  @Volatile var ultimaNota = "-"
                  @Volatile var debug = ""
              }

              @Volatile private var rodando = false
              private var thread: Thread? = null

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, flags: Int, id: Int): Int {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("ocarina", "Ocarina", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "ocarina")
                      .setContentTitle("Ocarina ativa")
                      .setContentText("Ouvindo o microfone")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(1, n)
                  }
                  if (!rodando) {
                      rodando = true
                      thread = Thread { loop() }.also { it.start() }
                  }
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  rodando = false
                  super.onDestroy()
              }

              private fun loop() {
                  val minBuf = AudioRecord.getMinBufferSize(SR, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                  val rec = AudioRecord(
                      MediaRecorder.AudioSource.MIC, SR, AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT, max(minBuf, BLOCO * 4)
                  )
                  rec.startRecording()
                  val buf = ShortArray(BLOCO)
                  val x = DoubleArray(BLOCO)
                  var cand = -1; var cont = 0; var silencio = 0; var atual = -1

                  while (rodando) {
                      var lidos = 0
                      while (lidos < BLOCO && rodando) {
                          val r = rec.read(buf, lidos, BLOCO - lidos)
                          if (r < 0) { Thread.sleep(10); break }
                          lidos += r
                      }
                      if (lidos < BLOCO) continue

                      val nota = detectar(buf, x)
                      if (nota < 0) {
                          silencio++; cand = -1; cont = 0
                          if (silencio >= 2 && atual != -1) {
                              atual = -1; ultimaNota = "-"
                              TapService.instance?.pressButton(null)
                          }
                          continue
                      }
                      silencio = 0
                      if (nota == cand) cont++ else { cand = nota; cont = 1 }
                      if (cont >= 2 && nota != atual) {
                          atual = nota; ultimaNota = NOMES[nota]
                          TapService.instance?.pressButton(nota)
                      }
                  }
                  rec.stop(); rec.release()
                  TapService.instance?.pressButton(null)
                  ultimaNota = "-"
              }

              private fun detectar(b: ShortArray, x: DoubleArray): Int {
                  var mean = 0.0
                  for (i in 0 until BLOCO) mean += b[i]
                  mean /= BLOCO
                  var ss = 0.0
                  for (i in 0 until BLOCO) { x[i] = (b[i] - mean) / 32768.0; ss += x[i] * x[i] }
                  val rms = sqrt(ss / BLOCO)
                  if (rms < VOLUME_MIN) { debug = "vol=%.3f (baixo)".format(rms); return -1 }

                  val amp = DoubleArray(5) { goertzel(x, BASE[it] * OITAVA) }
                  var best = 0
                  for (i in 1..4) if (amp[i] > amp[best]) best = i
                  var segundo = 0.0
                  for (i in 0..4) if (i != best && amp[i] > segundo) segundo = amp[i]
                  val pureza = amp[best] / (rms * sqrt(2.0))
                  debug = "vol=%.3f pureza=%.2f".format(rms, pureza)

                  return if (pureza >= PUREZA_MIN && amp[best] > 1.5 * segundo) best else -1
              }

              // Amplitude da frequência f no bloco (algoritmo de Goertzel)
              private fun goertzel(x: DoubleArray, f: Double): Double {
                  val k = 2 * cos(2 * PI * f / SR)
                  var s1 = 0.0; var s2 = 0.0
                  for (v in x) { val s = v + k * s1 - s2; s2 = s1; s1 = s }
                  val p = s1 * s1 + s2 * s2 - k * s1 * s2
                  return 2 * sqrt(max(p, 0.0)) / x.size
              }
          }
          ARQUIVO_FIM
          mkdir -p "$(dirname 'app/src/main/java/com/example/ocarina/TapService.kt')"
          cat > 'app/src/main/java/com/example/ocarina/TapService.kt' << 'ARQUIVO_FIM'
          package com.example.ocarina

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.accessibilityservice.GestureDescription.StrokeDescription
          import android.content.Context
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.PointF
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.FrameLayout
          import android.widget.TextView

          class TapService : AccessibilityService() {

              companion object {
                  @Volatile var instance: TapService? = null
                  private const val STEP = 60L // duração de cada pedaço do "toque contínuo"
              }

              private val main = Handler(Looper.getMainLooper())
              private var stroke: StrokeDescription? = null
              private var activePt: PointF? = null
              private var wanted: PointF? = null
              private var busy = false
              private var overlay: FrameLayout? = null

              override fun onServiceConnected() { instance = this }
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              override fun onDestroy() { instance = null; super.onDestroy() }

              // index = 0..4 (A, C-Baixo, C-Direita, C-Esquerda, C-Cima) ou null para soltar
              fun pressButton(index: Int?) {
                  val p = if (index == null) null else loadPoint(index)
                  main.post { wanted = p; pump() }
              }

              private fun loadPoint(i: Int): PointF? {
                  val sp = getSharedPreferences("ocarina", MODE_PRIVATE)
                  if (!sp.contains("x$i")) return null
                  return PointF(sp.getFloat("x$i", 0f), sp.getFloat("y$i", 0f))
              }

              private fun pathAt(p: PointF) = Path().apply { moveTo(p.x, p.y) }

              // Mantém um único dedo "virtual" apertado enquanto a nota estiver soando
              private fun pump() {
                  if (busy) return
                  val s = stroke
                  val a = activePt
                  val w = wanted
                  if (s != null && a != null) {
                      val keep = w != null && w == a
                      val next = s.continueStroke(pathAt(a), 0, STEP, keep)
                      if (keep) stroke = next else { stroke = null; activePt = null }
                      send(next)
                  } else if (w != null) {
                      val next = StrokeDescription(pathAt(w), 0, STEP, true)
                      stroke = next; activePt = w
                      send(next)
                  }
              }

              private fun send(s: StrokeDescription) {
                  busy = true
                  val ok = dispatchGesture(
                      GestureDescription.Builder().addStroke(s).build(),
                      object : GestureResultCallback() {
                          override fun onCompleted(g: GestureDescription?) { busy = false; pump() }
                          override fun onCancelled(g: GestureDescription?) {
                              busy = false; stroke = null; activePt = null; pump()
                          }
                      }, null
                  )
                  if (!ok) { busy = false; stroke = null; activePt = null }
              }

              // Mostra uma camada transparente: você toca onde fica cada botão do emulador
              fun startCalibration(delayMs: Long) {
                  main.postDelayed({
                      val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                      overlay?.let { try { wm.removeView(it) } catch (e: Exception) {} }
                      val ed = getSharedPreferences("ocarina", MODE_PRIVATE).edit()
                      val nomes = OcarinaService.NOMES
                      var step = 0

                      val tv = TextView(this).apply {
                          textSize = 22f; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                      }
                      fun label() { tv.text = "Toque onde fica o botão\n${nomes[step]}\n(${step + 1}/5)" }
                      label()

                      val root = FrameLayout(this).apply {
                          setBackgroundColor(0x66000000)
                          addView(tv, FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.CENTER))
                          setOnTouchListener { _, ev ->
                              if (ev.action == MotionEvent.ACTION_DOWN) {
                                  ed.putFloat("x$step", ev.rawX).putFloat("y$step", ev.rawY)
                                  step++
                                  if (step >= nomes.size) {
                                      ed.apply()
                                      wm.removeView(this)
                                      overlay = null
                                  } else label()
                              }
                              true
                          }
                      }
                      val lp = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT
                      )
                      wm.addView(root, lp)
                      overlay = root
                  }, delayMs)
              }
          }
          ARQUIVO_FIM
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          cat > 'app/src/main/res/values/strings.xml' << 'ARQUIVO_FIM'
          <resources>
              <string name="acess_desc">Aperta os botões na tela do emulador quando você toca notas na ocarina.</string>
          </resources>
          ARQUIVO_FIM
          mkdir -p "$(dirname 'app/src/main/res/xml/accessibility_config.xml')"
          cat > 'app/src/main/res/xml/accessibility_config.xml' << 'ARQUIVO_FIM'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:description="@string/acess_desc"
              android:notificationTimeout="100" />
          ARQUIVO_FIM
          mkdir -p "$(dirname 'build.gradle.kts')"
          cat > 'build.gradle.kts' << 'ARQUIVO_FIM'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          ARQUIVO_FIM
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' << 'ARQUIVO_FIM'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=false
          ARQUIVO_FIM
          mkdir -p "$(dirname 'settings.gradle.kts')"
          cat > 'settings.gradle.kts' << 'ARQUIVO_FIM'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OcarinaController"
          include(":app")
          ARQUIVO_FIM

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ocarina-apk
          path: app/build/outputs/apk/debug/app-debug.apk
Depois de salvar:

Vá na aba Actions. Uma nova execução deve começar sozinha (círculo amarelo).
Espere de 3 a 6 minutos. Se terminar em 30 segundos de novo, o arquivo foi colado incompleto.
Ao terminar com ✅, abra a execução. Em Artifacts deve aparecer ocarina-apk, que é o que você baixa.
Se aparecer um ❌, me mande a mensagem de erro em vermelho.

Screenshot_2026-11-11-18-47-59-514_com.android.chrome.jpg
Boa notícia: o erro é pequeno e só um. A compilação passou por quase tudo e parou numa linha do TapService.kt (o log diz “Val cannot be reassigned”).

O motivo: dentro daquele bloco, o nome overlay estava sendo confundido com uma propriedade interna do Android que não pode ser alterada. A correção é dizer explicitamente que é a variável do nosso serviço.

Como corrigir (só uma linha)

Vá em Code → .github → workflows → main.yml e toque no lápis.
Vá até a linha 423. Se o editor mostra os números das linhas, é só rolar até ela. Se não mostrar, procure pela linha que está sozinha com o texto overlay = null, que fica logo depois de wm.removeView(this).
Troque
   overlay = null
por

   this@TapService.overlay = null
Mantenha os espaços da frente da linha exatamente como estavam e mude só o texto.
4. Toque em Commit changes.

Como o arquivo está com o gatilho push, a compilação começa sozinha. Vá em Actions e espere uns 2 a 3 minutos (a anterior levou 2 minutos). Se ficar ✅ e aparecer ocarina-apk em Artifacts na página da execução, é só baixar.

Se você preferir não editar a linha, posso mandar o arquivo completo de novo já com a correção. Se der outro erro, me mande o print da mensagem que começa com e:.

O detector está ruim, e não tem como adicionar mais notas não ?

Executou 5 comandos
Estou finalizando o detector novo e a lista de notas editável. Já testei a lógica em simulação (75 de 75 notas corretas, mesmo desafinadas até 40 cents, e ruído e notas fora da lista ignorados). Não consegui compilar o Kotlin aqui, então o GitHub vai ser o teste final.

O que mudou no detector

Antes, ele só media a energia em 5 frequências fixas, e qualquer desafinação da ocarina derrubava a detecção. Agora ele acha a frequência real do som e vê qual nota está mais perto, com margem de ±50 cents.
Ele rejeita ruído e fala (só aceita um tom claro) e corrige quando um harmônico engana a detecção.
A análise é mais rápida, a cada ~23 ms.
A tela do app agora mostra a frequência e a nota real que ele ouviu (por exemplo “587 Hz = Ré5 (+12 c)”). Se o detector errar, você vê na hora o que ele escutou.
Como adicionar mais notas
Sim, dá. O jogo só usa 5 notas nas músicas, mas agora você pode mapear qualquer nota da sua ocarina para outro botão, como B ou Z. No código há uma lista NOTAS com exemplos comentados (Mi → B, Sol → Z). Para ativar, apague as duas barras // da linha. O botão novo é pedido na próxima calibração.

Como atualizar

Em Code → .github → workflows → main.yml, toque no lápis, apague tudo e cole o conteúdo abaixo. Confira se a última linha é path: app/build/outputs/apk/debug/app-debug.apk.
Faça o Commit changes. A compilação começa sozinha em Actions e leva uns 2 a 3 minutos.
Baixe o novo APK em Artifacts, instale por cima do antigo e calibre os botões de novo, porque o formato da calibração mudou.

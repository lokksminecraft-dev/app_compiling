name: Compilar APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Criar projeto
        run: |
          set -e
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' << 'ARQUIVO_FIM'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.ocarina"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.ocarina"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          ARQUIVO_FIM
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' << 'ARQUIVO_FIM'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:label="Ocarina Controller"
                  android:theme="@android:style/Theme.DeviceDefault">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".OcarinaService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />

                  <service
                      android:name=".TapService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          ARQUIVO_FIM
          mkdir -p "$(dirname 'app/src/main/java/com/example/ocarina/MainActivity.kt')"
          cat > 'app/src/main/java/com/example/ocarina/MainActivity.kt' << 'ARQUIVO_FIM'
          package com.example.ocarina

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private val h = Handler(Looper.getMainLooper())

              private val atualizar = object : Runnable {
                  override fun run() {
                      val acess = if (TapService.instance != null) "ativa" else "INATIVA"
                      status.text = "Acessibilidade: $acess\nNota: ${OcarinaService.ultimaNota}\n${OcarinaService.debug}"
                      h.postDelayed(this, 150)
                  }
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val ll = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 48, 48, 48)
                  }
                  status = TextView(this).apply { textSize = 18f }

                  fun botao(t: String, f: () -> Unit) {
                      ll.addView(Button(this).apply { text = t; setOnClickListener { f() } })
                  }

                  botao("1. Ativar acessibilidade") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  botao("2. Calibrar botões (começa em 10 s)") {
                      val s = TapService.instance
                      if (s == null) {
                          Toast.makeText(this, "Ative o serviço de acessibilidade primeiro", Toast.LENGTH_LONG).show()
                      } else {
                          s.startCalibration(10_000)
                          Toast.makeText(this, "Abra o emulador AGORA, com os botões na tela", Toast.LENGTH_LONG).show()
                      }
                  }
                  botao("3. Iniciar ocarina") { iniciar() }
                  botao("Parar") { stopService(Intent(this, OcarinaService::class.java)) }
                  ll.addView(status)
                  setContentView(ll)
              }

              override fun onResume() { super.onResume(); h.post(atualizar) }
              override fun onPause() { super.onPause(); h.removeCallbacks(atualizar) }

              private fun iniciar() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO, "android.permission.POST_NOTIFICATIONS"), 1)
                  } else {
                      startForegroundService(Intent(this, OcarinaService::class.java))
                  }
              }

              override fun onRequestPermissionsResult(code: Int, perms: Array<out String>, res: IntArray) {
                  super.onRequestPermissionsResult(code, perms, res)
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) iniciar()
              }
          }
          ARQUIVO_FIM
          mkdir -p "$(dirname 'app/src/main/java/com/example/ocarina/OcarinaService.kt')"
          cat > 'app/src/main/java/com/example/ocarina/OcarinaService.kt' << 'ARQUIVO_FIM'
          package com.example.ocarina

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaRecorder
          import android.os.Build
          import android.os.IBinder
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.ln
          import kotlin.math.log2
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.pow
          import kotlin.math.roundToInt
          import kotlin.math.sin
          import kotlin.math.sqrt

          // nome = só para exibir | midi = nota na notação do N64 (62 = Ré, 65 = Fá...) | botao = botão a apertar
          class Nota(val nome: String, val midi: Int, val botao: String)

          class OcarinaService : Service() {

              companion object {
                  // ===================== CONFIGURAÇÃO =====================
                  // Para ADICIONAR NOTAS: acrescente linhas aqui. Dois botões iguais usam a mesma posição.
                  // Cada botão novo será pedido na calibração.
                  // MIDI: Dó=60 Dó#=61 Ré=62 Ré#=63 Mi=64 Fá=65 Fá#=66 Sol=67 Sol#=68 Lá=69 Lá#=70 Si=71 Dó agudo=72
                  val NOTAS = listOf(
                      Nota("Ré", 62, "A"),
                      Nota("Fá", 65, "C-Baixo"),
                      Nota("Lá", 69, "C-Direita"),
                      Nota("Si", 71, "C-Esquerda"),
                      Nota("Ré agudo", 74, "C-Cima"),
                      // Exemplos (apague as duas barras para ativar):
                      // Nota("Mi", 64, "B"),
                      // Nota("Sol", 67, "Z"),
                  )

                  // Semitons que sua ocarina soa ACIMA da notação acima.
                  // Ocarina 12 furos Alto C = 12. Se a sua soar mais grave, use 0.
                  // A tela do app mostra a nota real detectada para você conferir.
                  const val DESLOCAR = 12

                  // Se sua ocarina é afinada diferente de A=440 Hz, ajuste em cents (ex.: -30).
                  const val AFINACAO = 0.0

                  // Margem aceita de desafinação, em cents (100 cents = 1 semitom).
                  const val TOLERANCIA = 50.0

                  const val VOLUME_MIN = 0.01   // sobe se pegar ruído, desce se não detectar
                  const val TONALIDADE = 6.0    // sobe se pegar ruído, desce se não detectar notas
                  // ========================================================

                  val BOTOES: List<String> get() = NOTAS.map { it.botao }.distinct()

                  const val SR = 44100
                  const val HOP = 1024        // análise a cada ~23 ms
                  const val JANELA = 4096     // trecho analisado (~93 ms)
                  const val FFT_N = 16384

                  val NOMES_NOTAS = arrayOf("Dó", "Dó#", "Ré", "Ré#", "Mi", "Fá", "Fá#", "Sol", "Sol#", "Lá", "Lá#", "Si")

                  @Volatile var ultimaNota = "-"
                  @Volatile var debug = ""
              }

              @Volatile private var rodando = false
              private var thread: Thread? = null

              private val re = DoubleArray(FFT_N)
              private val im = DoubleArray(FFT_N)
              private val mag = DoubleArray(FFT_N / 2)
              private val hann = DoubleArray(JANELA) { 0.5 - 0.5 * cos(2 * PI * it / (JANELA - 1)) }
              private val cosT = DoubleArray(FFT_N / 2) { cos(-2 * PI * it / FFT_N) }
              private val sinT = DoubleArray(FFT_N / 2) { sin(-2 * PI * it / FFT_N) }
              private val rev = IntArray(FFT_N) { Integer.reverse(it) ushr (32 - Integer.numberOfTrailingZeros(FFT_N)) }
              private val binHz = SR.toDouble() / FFT_N
              private val iMin = (NOTAS.minOf { freqDe(it) } * 0.85 / binHz).toInt()
              private val iMax = min((NOTAS.maxOf { freqDe(it) } * 1.15 / binHz).toInt(), FFT_N / 2 - 2)

              private fun freqDe(n: Nota): Double = 440.0 * 2.0.pow((n.midi + DESLOCAR - 69) / 12.0)

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, flags: Int, id: Int): Int {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("ocarina", "Ocarina", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "ocarina")
                      .setContentTitle("Ocarina ativa")
                      .setContentText("Ouvindo o microfone")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(1, n)
                  }
                  if (!rodando) {
                      rodando = true
                      thread = Thread { loop() }.also { it.start() }
                  }
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  rodando = false
                  super.onDestroy()
              }

              private fun loop() {
                  val minBuf = AudioRecord.getMinBufferSize(SR, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                  val rec = AudioRecord(
                      MediaRecorder.AudioSource.MIC, SR, AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT, max(minBuf, HOP * 8)
                  )
                  rec.startRecording()
                  val hop = ShortArray(HOP)
                  val ring = DoubleArray(JANELA)
                  var cheio = 0
                  var cand = -1; var cont = 0; var silencio = 0; var atual = -1

                  while (rodando) {
                      var lidos = 0
                      while (lidos < HOP && rodando) {
                          val r = rec.read(hop, lidos, HOP - lidos)
                          if (r < 0) { Thread.sleep(10); break }
                          lidos += r
                      }
                      if (lidos < HOP) continue

                      System.arraycopy(ring, HOP, ring, 0, JANELA - HOP)
                      for (i in 0 until HOP) ring[JANELA - HOP + i] = hop[i] / 32768.0
                      if (cheio < JANELA) { cheio += HOP; continue }

                      val nota = analisar(ring)
                      if (nota < 0) {
                          silencio++; cand = -1; cont = 0
                          if (silencio >= 3 && atual != -1) {
                              atual = -1; ultimaNota = "-"
                              TapService.instance?.pressButton(null)
                          }
                          continue
                      }
                      silencio = 0
                      if (nota == cand) cont++ else { cand = nota; cont = 1 }
                      if (cont >= 2 && nota != atual) {
                          atual = nota
                          ultimaNota = NOTAS[nota].nome + " -> " + NOTAS[nota].botao
                          TapService.instance?.pressButton(NOTAS[nota].botao)
                      }
                  }
                  rec.stop(); rec.release()
                  TapService.instance?.pressButton(null)
                  ultimaNota = "-"
              }

              // Devolve o índice da nota em NOTAS, ou -1 se não houver nota válida
              private fun analisar(x: DoubleArray): Int {
                  var mean = 0.0
                  for (v in x) mean += v
                  mean /= JANELA
                  var ss = 0.0
                  for (i in 0 until JANELA) {
                      val v = x[i] - mean
                      ss += v * v
                      re[i] = v * hann[i]
                      im[i] = 0.0
                  }
                  val rms = sqrt(ss / JANELA)
                  if (rms < VOLUME_MIN) { debug = "vol=%.3f (baixo demais)".format(rms); return -1 }
                  for (i in JANELA until FFT_N) { re[i] = 0.0; im[i] = 0.0 }
                  fft()

                  var soma = 0.0
                  var p = iMin
                  for (i in iMin..iMax) {
                      val m = sqrt(re[i] * re[i] + im[i] * im[i])
                      mag[i] = m
                      soma += m
                      if (m > mag[p]) p = i
                  }
                  val media = soma / (iMax - iMin + 1)
                  if (mag[p] < TONALIDADE * media) { debug = "vol=%.3f (nenhuma nota clara)".format(rms); return -1 }

                  // Se o pico for um harmônico (2x), usa a fundamental
                  val h = p / 2
                  if (h - 3 >= iMin) {
                      var q = h - 3
                      for (i in (h - 3)..(h + 3)) if (mag[i] > mag[q]) q = i
                      if (mag[q] > 0.4 * mag[p]) p = q
                  }

                  // Refina a frequência entre os bins (interpolação parabólica)
                  var d = 0.0
                  if (p > iMin && p < iMax) {
                      val a = ln(mag[p - 1] + 1e-12)
                      val b = ln(mag[p] + 1e-12)
                      val c = ln(mag[p + 1] + 1e-12)
                      val den = a - 2 * b + c
                      if (den != 0.0) d = 0.5 * (a - c) / den
                  }
                  val f = (p + d) * binHz
                  val midi = 69 + 12 * log2(f / 440.0) - AFINACAO / 100.0

                  var melhor = -1
                  var melhorDif = 1e9
                  for (i in NOTAS.indices) {
                      val dif = abs(midi - (NOTAS[i].midi + DESLOCAR)) * 100
                      if (dif < melhorDif) { melhorDif = dif; melhor = i }
                  }

                  val m0 = midi.roundToInt()
                  val cents = (midi - m0) * 100
                  debug = "%.0f Hz = %s%d (%+.0f c)  vol=%.3f".format(
                      f, NOMES_NOTAS[((m0 % 12) + 12) % 12], m0 / 12 - 1, cents, rms
                  )
                  return if (melhorDif <= TOLERANCIA) melhor else -1
              }

              private fun fft() {
                  val n = FFT_N
                  for (i in 0 until n) {
                      val j = rev[i]
                      if (j > i) {
                          val tr = re[i]; re[i] = re[j]; re[j] = tr
                          val ti = im[i]; im[i] = im[j]; im[j] = ti
                      }
                  }
                  var len = 2
                  while (len <= n) {
                      val half = len / 2
                      val step = n / len
                      var i = 0
                      while (i < n) {
                          var k = 0
                          for (j in 0 until half) {
                              val wr = cosT[k]
                              val wi = sinT[k]
                              val a = i + j
                              val b = a + half
                              val tr = re[b] * wr - im[b] * wi
                              val ti = re[b] * wi + im[b] * wr
                              re[b] = re[a] - tr
                              im[b] = im[a] - ti
                              re[a] += tr
                              im[a] += ti
                              k += step
                          }
                          i += len
                      }
                      len = len shl 1
                  }
              }
          }
          ARQUIVO_FIM
          mkdir -p "$(dirname 'app/src/main/java/com/example/ocarina/TapService.kt')"
          cat > 'app/src/main/java/com/example/ocarina/TapService.kt' << 'ARQUIVO_FIM'
          package com.example.ocarina

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.accessibilityservice.GestureDescription.StrokeDescription
          import android.content.Context
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.PointF
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.FrameLayout
         

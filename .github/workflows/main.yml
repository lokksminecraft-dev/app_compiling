name: Compilar APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Criar projeto
        run: |
          set -e
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' << 'ARQUIVO_FIM'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.ocarina"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.ocarina"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          ARQUIVO_FIM
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' << 'ARQUIVO_FIM'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:label="Ocarina Controller"
                  android:theme="@android:style/Theme.DeviceDefault">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".OcarinaService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />

                  <service
                      android:name=".TapService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          ARQUIVO_FIM
          mkdir -p "$(dirname 'app/src/main/java/com/example/ocarina/Cfg.kt')"
          cat > 'app/src/main/java/com/example/ocarina/Cfg.kt' << 'ARQUIVO_FIM'
          package com.example.ocarina

          import android.content.Context

          // Configurações ajustáveis pelo HUD flutuante (salvas no aparelho)
          object Cfg {
              @Volatile var ativo = true
              @Volatile var volumeMin = 0.01f
              @Volatile var tonalidade = 6f
              @Volatile var tolerancia = 50f
              @Volatile var soltarMs = 250f
              @Volatile var estabilidade = 2f
              @Volatile var deslocar = 12
              @Volatile var afinacao = 0f
              @Volatile var retocar = true
              @Volatile var stepMs = 120f
              private var carregado = false

              fun init(ctx: Context) {
                  if (carregado) return
                  carregado = true
                  val sp = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  volumeMin = sp.getFloat("volumeMin", volumeMin)
                  tonalidade = sp.getFloat("tonalidade", tonalidade)
                  tolerancia = sp.getFloat("tolerancia", tolerancia)
                  soltarMs = sp.getFloat("soltarMs", soltarMs)
                  estabilidade = sp.getFloat("estabilidade", estabilidade)
                  deslocar = sp.getInt("deslocar", deslocar)
                  afinacao = sp.getFloat("afinacao", afinacao)
                  retocar = sp.getBoolean("retocar", retocar)
                  stepMs = sp.getFloat("stepMs", stepMs)
              }

              fun salvar(ctx: Context) {
                  ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE).edit()
                      .putFloat("volumeMin", volumeMin)
                      .putFloat("tonalidade", tonalidade)
                      .putFloat("tolerancia", tolerancia)
                      .putFloat("soltarMs", soltarMs)
                      .putFloat("estabilidade", estabilidade)
                      .putInt("deslocar", deslocar)
                      .putFloat("afinacao", afinacao)
                      .putBoolean("retocar", retocar)
                      .putFloat("stepMs", stepMs)
                      .apply()
              }

              fun modoPiano() {
                  volumeMin = 0.006f; tonalidade = 4f; tolerancia = 50f
                  soltarMs = 400f; estabilidade = 3f; retocar = true; stepMs = 120f
              }

              fun modoOcarina() {
                  volumeMin = 0.01f; tonalidade = 6f; tolerancia = 50f
                  soltarMs = 250f; estabilidade = 2f; retocar = true; stepMs = 120f
              }
          }
          ARQUIVO_FIM
          mkdir -p "$(dirname 'app/src/main/java/com/example/ocarina/MainActivity.kt')"
          cat > 'app/src/main/java/com/example/ocarina/MainActivity.kt' << 'ARQUIVO_FIM'
          package com.example.ocarina

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private val h = Handler(Looper.getMainLooper())

              private val atualizar = object : Runnable {
                  override fun run() {
                      val acess = if (TapService.instance != null) "ativa" else "INATIVA"
                      status.text = "Acessibilidade: $acess\nNota: ${OcarinaService.ultimaNota}\n${OcarinaService.debug}"
                      h.postDelayed(this, 150)
                  }
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  Cfg.init(this)
                  val ll = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 48, 48, 48)
                  }
                  status = TextView(this).apply { textSize = 18f }

                  fun botao(t: String, f: () -> Unit) {
                      ll.addView(Button(this).apply { text = t; setOnClickListener { f() } })
                  }

                  botao("1. Ativar acessibilidade") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  botao("2. Calibrar botões (começa em 10 s)") {
                      val s = TapService.instance
                      if (s == null) {
                          Toast.makeText(this, "Ative o serviço de acessibilidade primeiro", Toast.LENGTH_LONG).show()
                      } else {
                          s.startCalibration(10_000)
                          Toast.makeText(this, "Abra o emulador AGORA, com os botões na tela", Toast.LENGTH_LONG).show()
                      }
                  }
                  botao("3. Iniciar ocarina") { iniciar() }
                  botao("4. Mostrar/ocultar HUD flutuante") {
                      val s = TapService.instance
                      if (s == null) {
                          Toast.makeText(this, "Ative o serviço de acessibilidade primeiro", Toast.LENGTH_LONG).show()
                      } else s.alternarHud()
                  }
                  botao("Parar") { stopService(Intent(this, OcarinaService::class.java)) }
                  ll.addView(status)
                  setContentView(ll)
              }

              override fun onResume() { super.onResume(); h.post(atualizar) }
              override fun onPause() { super.onPause(); h.removeCallbacks(atualizar) }

              private fun iniciar() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO, "android.permission.POST_NOTIFICATIONS"), 1)
                  } else {
                      startForegroundService(Intent(this, OcarinaService::class.java))
                  }
              }

              override fun onRequestPermissionsResult(code: Int, perms: Array<out String>, res: IntArray) {
                  super.onRequestPermissionsResult(code, perms, res)
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) iniciar()
              }
          }
          ARQUIVO_FIM
          mkdir -p "$(dirname 'app/src/main/java/com/example/ocarina/OcarinaService.kt')"
          cat > 'app/src/main/java/com/example/ocarina/OcarinaService.kt' << 'ARQUIVO_FIM'
          package com.example.ocarina

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaRecorder
          import android.os.Build
          import android.os.IBinder
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.ceil
          import kotlin.math.cos
          import kotlin.math.ln
          import kotlin.math.log2
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.pow
          import kotlin.math.roundToInt
          import kotlin.math.sin
          import kotlin.math.sqrt

          // nome = só para exibir | midi = nota na notação do N64 (62 = Ré, 65 = Fá...) | botao = botão a apertar
          class Nota(val nome: String, val midi: Int, val botao: String)

          class OcarinaService : Service() {

              companion object {
                  // Para ADICIONAR NOTAS: acrescente linhas aqui. Dois botões iguais usam a mesma posição.
                  // Cada botão novo será pedido na calibração.
                  // MIDI: Dó=60 Dó#=61 Ré=62 Ré#=63 Mi=64 Fá=65 Fá#=66 Sol=67 Sol#=68 Lá=69 Lá#=70 Si=71 Dó agudo=72
                  // As demais configurações (oitava, sensibilidade etc.) ficam no HUD flutuante.
                  val NOTAS = listOf(
                      Nota("Ré", 62, "A"),
                      Nota("Fá", 65, "C-Baixo"),
                      Nota("Lá", 69, "C-Direita"),
                      Nota("Si", 71, "C-Esquerda"),
                      Nota("Ré agudo", 74, "C-Cima"),
                      // Exemplos (apague as duas barras para ativar):
                      // Nota("Mi", 64, "B"),
                      // Nota("Sol", 67, "Z"),
                  )

                  val BOTOES: List<String> get() = NOTAS.map { it.botao }.distinct()

                  const val SR = 44100
                  const val HOP = 1024        // análise a cada ~23 ms
                  const val JANELA = 4096     // trecho analisado (~93 ms)
                  const val FFT_N = 16384
                  const val HOP_MS = 1000.0 * HOP / SR

                  val NOMES_NOTAS = arrayOf("Dó", "Dó#", "Ré", "Ré#", "Mi", "Fá", "Fá#", "Sol", "Sol#", "Lá", "Lá#", "Si")

                  @Volatile var ultimaNota = "-"
                  @Volatile var debug = ""
              }

              @Volatile private var rodando = false
              private var thread: Thread? = null
              private var ultimoRms = 0.0

              private val re = DoubleArray(FFT_N)
              private val im = DoubleArray(FFT_N)
              private val mag = DoubleArray(FFT_N / 2)
              private val hann = DoubleArray(JANELA) { 0.5 - 0.5 * cos(2 * PI * it / (JANELA - 1)) }
              private val cosT = DoubleArray(FFT_N / 2) { cos(-2 * PI * it / FFT_N) }
              private val sinT = DoubleArray(FFT_N / 2) { sin(-2 * PI * it / FFT_N) }
              private val rev = IntArray(FFT_N) { Integer.reverse(it) ushr (32 - Integer.numberOfTrailingZeros(FFT_N)) }
              private val binHz = SR.toDouble() / FFT_N

              private fun freqDe(n: Nota): Double = 440.0 * 2.0.pow((n.midi + Cfg.deslocar - 69) / 12.0)

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, flags: Int, id: Int): Int {
                  Cfg.init(this)
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("ocarina", "Ocarina", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "ocarina")
                      .setContentTitle("Ocarina ativa")
                      .setContentText("Ouvindo o microfone")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(1, n)
                  }
                  if (!rodando) {
                      rodando = true
                      thread = Thread { loop() }.also { it.start() }
                  }
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  rodando = false
                  super.onDestroy()
              }

              private fun loop() {
                  val minBuf = AudioRecord.getMinBufferSize(SR, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                  val rec = AudioRecord(
                      MediaRecorder.AudioSource.MIC, SR, AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT, max(minBuf, HOP * 8)
                  )
                  rec.startRecording()
                  val hop = ShortArray(HOP)
                  val ring = DoubleArray(JANELA)
                  val hist = DoubleArray(4)
                  var histI = 0
                  var cheio = 0
                  var cand = -1; var cont = 0; var silencio = 0; var atual = -1
                  var ultimoPress = 0L

                  while (rodando) {
                      var lidos = 0
                      while (lidos < HOP && rodando) {
                          val r = rec.read(hop, lidos, HOP - lidos)
                          if (r < 0) { Thread.sleep(10); break }
                          lidos += r
                      }
                      if (lidos < HOP) continue

                      System.arraycopy(ring, HOP, ring, 0, JANELA - HOP)
                      for (i in 0 until HOP) ring[JANELA - HOP + i] = hop[i] / 32768.0
                      if (cheio < JANELA) { cheio += HOP; continue }

                      if (!Cfg.ativo) {
                          if (atual != -1) { atual = -1; TapService.instance?.pressButton(null) }
                          cand = -1; cont = 0; silencio = 0
                          ultimaNota = "(pausado)"
                          continue
                      }

                      val nota = analisar(ring, atual != -1)
                      val rms = ultimoRms
                      val rmsAnterior = (hist[0] + hist[1] + hist[2] + hist[3]) / 4
                      hist[histI] = rms
                      histI = (histI + 1) % 4

                      val agora = System.currentTimeMillis()
                      val estab = Cfg.estabilidade.roundToInt().coerceIn(1, 8)
                      val maxSilencio = ceil(Cfg.soltarMs / HOP_MS).toInt().coerceAtLeast(1)

                      if (nota < 0) {
                          // Falhas curtas não soltam o botão: só solta depois de "soltarMs" de silêncio
                          cand = -1; cont = 0; silencio++
                          if (atual != -1 && silencio >= maxSilencio) {
                              atual = -1; ultimaNota = "-"
                              TapService.instance?.pressButton(null)
                          }
                      } else {
                          silencio = 0
                          if (nota == cand) cont++ else { cand = nota; cont = 1 }
                          if (atual == -1) {
                              if (cont >= estab) {
                                  atual = nota
                                  ultimaNota = NOTAS[nota].nome + " -> " + NOTAS[nota].botao
                                  TapService.instance?.pressButton(NOTAS[nota].botao)
                                  ultimoPress = agora
                              }
                          } else if (nota != atual) {
                              // Trocar de nota exige mais confirmações do que começar uma
                              if (cont >= estab + 1) {
                                  atual = nota
                                  ultimaNota = NOTAS[nota].nome + " -> " + NOTAS[nota].botao
                                  TapService.instance?.pressButton(NOTAS[nota].botao)
                                  ultimoPress = agora
                              }
                          } else if (Cfg.retocar && rms > 1.6 * rmsAnterior && rms > Cfg.volumeMin && agora - ultimoPress > 300) {
                              // Mesma nota tocada de novo (volume subiu de repente): aperta outra vez
                              TapService.instance?.repress(NOTAS[nota].botao)
                              ultimoPress = agora
                          }
                      }
                  }
                  rec.stop(); rec.release()
                  TapService.instance?.pressButton(null)
                  ultimaNota = "-"
              }

              // Devolve o índice da nota em NOTAS, ou -1 se não houver nota válida
              private fun analisar(x: DoubleArray, sustentando: Boolean): Int {
                  var mean = 0.0
                  for (v in x) mean += v
                  mean /= JANELA
                  var ss = 0.0
                  for (i in 0 until JANELA) {
                      val v = x[i] - mean
                      ss += v * v
                      re[i] = v * hann[i]
                      im[i] = 0.0
                  }
                  val rms = sqrt(ss / JANELA)
                  ultimoRms = rms
                  // Enquanto uma nota soa, aceita volume e "limpeza" menores (a nota vai morrendo)
                  val volMin = Cfg.volumeMin * (if (sustentando) 0.4 else 1.0)
                  if (rms < volMin) { debug = "vol=%.3f (baixo demais)".format(rms); return -1 }
                  for (i in JANELA until FFT_N) { re[i] = 0.0; im[i] = 0.0 }
                  fft()

                  var fLo = Double.MAX_VALUE
                  var fHi = 0.0
                  for (n in NOTAS) {
                      val f = freqDe(n)
                      if (f < fLo) fLo = f
                      if (f > fHi) fHi = f
                  }
                  val iMin = max(4, (fLo * 0.45 / binHz).toInt())
                  val iMax = min((fHi * 1.15 / binHz).toInt(), FFT_N / 2 - 2)

                  var soma = 0.0
                  var p = iMin
                  for (i in iMin..iMax) {
                      val m = sqrt(re[i] * re[i] + im[i] * im[i])
                      mag[i] = m
                      soma += m
                      if (m > mag[p]) p = i
                  }
                  val media = soma / (iMax - iMin + 1)
                  val ton = Cfg.tonalidade * (if (sustentando) 0.6 else 1.0)
                  if (mag[p] < ton * media) { debug = "vol=%.3f (nenhuma nota clara)".format(rms); return -1 }

                  // Se o pico for um harmônico (2x), usa a fundamental
                  val h = p / 2
                  if (h - 3 >= iMin) {
                      var q = h - 3
                      for (i in (h - 3)..(h + 3)) if (mag[i] > mag[q]) q = i
                      if (mag[q] > 0.4 * mag[p]) p = q
                  }

                  // Refina a frequência entre os bins (interpolação parabólica)
                  var d = 0.0
                  if (p > iMin && p < iMax) {
                      val a = ln(mag[p - 1] + 1e-12)
                      val b = ln(mag[p] + 1e-12)
                      val c = ln(mag[p + 1] + 1e-12)
                      val den = a - 2 * b + c
                      if (den != 0.0) d = 0.5 * (a - c) / den
                  }
                  val f = (p + d) * binHz
                  val midi = 69 + 12 * log2(f / 440.0) - Cfg.afinacao / 100.0

                  var melhor = -1
                  var melhorDif = 1e9
                  for (i in NOTAS.indices) {
                      val dif = abs(midi - (NOTAS[i].midi + Cfg.deslocar)) * 100
                      if (dif < melhorDif) { melhorDif = dif; melhor = i }
                  }

                  val m0 = midi.roundToInt()
                  val cents = (midi - m0) * 100
                  debug = "%.0f Hz = %s%d (%+.0f c)  vol=%.3f".format(
                      f, NOMES_NOTAS[((m0 % 12) + 12) % 12], m0 / 12 - 1, cents, rms
                  )
                  return if (melhorDif <= Cfg.tolerancia) melhor else -1
              }

              private fun fft() {
                  val n = FFT_N
                  for (i in 0 until n) {
                      val j = rev[i]
                      if (j > i) {
                          val tr = re[i]; re[i] = re[j]; re[j] = tr
                          val ti = im[i]; im[i] = im[j]; im[j] = ti
                      }
                  }
                  var len = 2
                  while (len <= n) {
                      val half = len / 2
                      val step = n / len
                      var i = 0
                      while (i < n) {
                          var k = 0
                          for (j in 0 until half) {
                              val wr = cosT[k]
                              val wi = sinT[k]
                              val a = i + j
                              val b = a + half
                              val tr = re[b] * wr - im[b] * wi
                              val ti = re[b] * wi + im[b] * wr
                              re[b] = re[a] - tr
                              im[b] = im[a] - ti
                              re[a] += tr
                              im[a] += ti
                              k += step
                          }
                          i += len
                      }
                      len = len shl 1
                  }
              }
          }
          ARQUIVO_FIM
          mkdir -p "$(dirname 'app/src/main/java/com/example/ocarina/TapService.kt')"
          cat > 'app/src/main/java/com/example/ocarina/TapService.kt' << 'ARQUIVO_FIM'
          package com.example.ocarina

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.accessibilityservice.GestureDescription.StrokeDescription
          import android.content.Context
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.PointF
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView
          import kotlin.math.abs
          import kotlin.math.min

          class TapService : AccessibilityService() {

              companion object {
                  @Volatile var instance: TapService? = null
                  @Volatile var nCancel = 0       // toques cancelados pelo sistema (diagnóstico)
                  @Volatile var nComandos = 0     // apertos pedidos pelo detector (diagnóstico)
              }

              private val main = Handler(Looper.getMainLooper())
              private var stroke: StrokeDescription? = null
              private var activePt: PointF? = null
              private var wanted: PointF? = null
              private var busy = false
              private var forceEnd = false
              private var noPressBefore = 0L
              private var camada: FrameLayout? = null

              private var hud: LinearLayout? = null
              private var cabTv: TextView? = null
              private var stTv: TextView? = null
              private var hudAberto = false
              private var hudX = 40
              private var hudY = 200

              private val atualizarHud = object : Runnable {
                  override fun run() {
                      val n = OcarinaService.ultimaNota
                      cabTv?.text = if (n != "-") "♪ $n" else "♪ Ocarina"
                      if (hudAberto) {
                          stTv?.text = "Nota: $n\n${OcarinaService.debug}\n" +
                              "Apertos pedidos: $nComandos | Toques cancelados: $nCancel"
                      }
                      main.postDelayed(this, 200)
                  }
              }

              override fun onServiceConnected() { instance = this; Cfg.init(this) }
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              override fun onDestroy() { ocultarHud(); instance = null; super.onDestroy() }

              // botao = nome do botão (ex.: "A", "C-Baixo") ou null para soltar
              fun pressButton(botao: String?) {
                  val p = if (botao == null) null else loadPoint(botao)
                  if (p != null) nComandos++
                  main.post { wanted = p; pump() }
              }

              // Solta e aperta de novo o mesmo botão (nota repetida)
              fun repress(botao: String) {
                  val p = loadPoint(botao)
                  if (p != null) nComandos++
                  main.post { wanted = p; forceEnd = true; pump() }
              }

              private fun loadPoint(b: String): PointF? {
                  val sp = getSharedPreferences("ocarina", MODE_PRIVATE)
                  if (!sp.contains("x_$b")) return null
                  return PointF(sp.getFloat("x_$b", 0f), sp.getFloat("y_$b", 0f))
              }

              private fun pathAt(p: PointF) = Path().apply { moveTo(p.x, p.y) }

              // Mantém um único dedo "virtual" apertado enquanto a nota estiver soando
              private fun pump() {
                  if (busy) return
                  val passo = Cfg.stepMs.toLong()
                  val s = stroke
                  val a = activePt
                  val w = wanted
                  if (s != null && a != null) {
                      val keep = w != null && w == a && !forceEnd
                      if (!keep && forceEnd) { forceEnd = false; noPressBefore = SystemClock.uptimeMillis() + 50 }
                      val next = s.continueStroke(pathAt(a), 0, if (keep) passo else 1L, keep)
                      if (keep) stroke = next else { stroke = null; activePt = null }
                      send(next)
                  } else if (w != null) {
                      val espera = noPressBefore - SystemClock.uptimeMillis()
                      if (espera > 0) { main.postDelayed({ pump() }, espera); return }
                      val next = StrokeDescription(pathAt(w), 0, passo, true)
                      stroke = next; activePt = w
                      send(next)
                  }
              }

              private fun send(s: StrokeDescription) {
                  busy = true
                  val ok = dispatchGesture(
                      GestureDescription.Builder().addStroke(s).build(),
                      object : GestureResultCallback() {
                          override fun onCompleted(g: GestureDescription?) { busy = false; pump() }
                          override fun onCancelled(g: GestureDescription?) {
                              nCancel++
                              busy = false; stroke = null; activePt = null
                              main.postDelayed({ pump() }, 80)
                          }
                      }, null
                  )
                  if (!ok) { busy = false; stroke = null; activePt = null }
              }

              // ============ Calibração ============
              // Mostra uma camada transparente: você toca onde fica cada botão do emulador
              fun startCalibration(delayMs: Long) {
                  main.postDelayed({
                      val wm = wmgr()
                      camada?.let { try { wm.removeView(it) } catch (e: Exception) {} }
                      val ed = getSharedPreferences("ocarina", MODE_PRIVATE).edit()
                      val nomes = OcarinaService.BOTOES
                      var step = 0

                      val tv = TextView(this).apply {
                          textSize = 22f; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                      }
                      fun label() { tv.text = "Toque onde fica o botão\n${nomes[step]}\n(${step + 1}/${nomes.size})" }
                      label()

                      val root = FrameLayout(this).apply {
                          setBackgroundColor(0x66000000)
                          addView(tv, FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.CENTER))
                          setOnTouchListener { _, ev ->
                              if (ev.action == MotionEvent.ACTION_DOWN) {
                                  ed.putFloat("x_${nomes[step]}", ev.rawX).putFloat("y_${nomes[step]}", ev.rawY)
                                  step++
                                  if (step >= nomes.size) {
                                      ed.apply()
                                      wm.removeView(this)
                                      camada = null
                                  } else label()
                              }
                              true
                          }
                      }
                      val lp = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT
                      )
                      wm.addView(root, lp)
                      camada = root
                  }, delayMs)
              }

              // ============ HUD flutuante ============
              private fun wmgr() = getSystemService(Context.WINDOW_SERVICE) as WindowManager
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun fundo(cor: Int) = GradientDrawable().apply {
                  setColor(cor)
                  cornerRadius = dp(12).toFloat()
              }

              private fun txt(t: String, tam: Float = 13f) = TextView(this).apply {
                  text = t; textSize = tam; setTextColor(Color.WHITE)
              }

              fun alternarHud() {
                  main.post { if (hud == null) mostrarHud() else ocultarHud() }
              }

              private fun ocultarHud() {
                  main.removeCallbacks(atualizarHud)
                  hud?.let { try { wmgr().removeView(it) } catch (e: Exception) {} }
                  hud = null
              }

              private fun recarregarHud() {
                  main.post { ocultarHud(); mostrarHud() }
              }

              private fun slider(
                  pai: LinearLayout, titulo: String, vmin: Float, vmax: Float,
                  ler: () -> Float, gravar: (Float) -> Unit, fmt: (Float) -> String
              ) {
                  val tv = txt("$titulo: ${fmt(ler())}", 12f)
                  val sb = SeekBar(this)
                  sb.max = 1000
                  sb.progress = (((ler() - vmin) / (vmax - vmin)) * 1000).toInt().coerceIn(0, 1000)
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) {
                          val v = vmin + (vmax - vmin) * p / 1000f
                          gravar(v)
                          tv.text = "$titulo: ${fmt(v)}"
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) { Cfg.salvar(this@TapService) }
                  })
                  pai.addView(tv)
                  pai.addView(sb)
              }

              private fun mostrarHud() {
                  Cfg.init(this)
                  val wm = wmgr()
                  val raiz = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

                  val cabecalho = txt("♪ Ocarina", 14f).apply {
                      setPadding(dp(12), dp(8), dp(12), dp(8))
                      background = fundo(Color.argb(220, 27, 94, 32))
                  }
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(12), dp(8), dp(12), dp(12))
                  }
                  val rolagem = ScrollView(this).apply {
                      background = fundo(Color.argb(235, 24, 24, 24))
                      addView(col)
                      visibility = if (hudAberto) View.VISIBLE else View.GONE
                  }
                  val larg = min(dp(300), (resources.displayMetrics.widthPixels * 0.9).toInt())
                  val alt = (resources.displayMetrics.heightPixels * 0.55).toInt()
                  raiz.addView(cabecalho)
                  raiz.addView(rolagem, LinearLayout.LayoutParams(larg, alt))

                  // Estado ao vivo
                  val st = txt("...", 12f)
                  col.addView(st)

                  col.addView(CheckBox(this).apply {
                      text = "Escuta ativa"
                      setTextColor(Color.WHITE)
                      isChecked = Cfg.ativo
                      setOnCheckedChangeListener { _, v -> Cfg.ativo = v }
                  })

                  // Modos prontos
                  val linhaPre = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  fun preset(nome: String, f: () -> Unit) {
                      linhaPre.addView(Button(this).apply {
                          text = nome; textSize = 12f
                          setOnClickListener { f(); Cfg.salvar(this@TapService); recarregarHud() }
                      }, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  }
                  preset("Modo piano") { Cfg.modoPiano() }
                  preset("Modo ocarina") { Cfg.modoOcarina() }
                  col.addView(linhaPre)

                  // Deslocamento de oitava
                  val tvDesl = txt("", 12f)
                  fun atualizarDesl() { tvDesl.text = "Deslocar notas: ${Cfg.deslocar} semitons (12 = uma oitava acima)" }
                  atualizarDesl()
                  col.addView(tvDesl)
                  val linhaD = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  for (d in intArrayOf(-12, -1, 1, 12)) {
                      linhaD.addView(Button(this).apply {
                          text = if (d > 0) "+$d" else "$d"
                          textSize = 12f
                          setOnClickListener { Cfg.deslocar += d; atualizarDesl(); Cfg.salvar(this@TapService) }
                      }, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  }
                  col.addView(linhaD)

                  slider(col, "Volume mínimo (menor = mais sensível)", 0.002f, 0.05f,
                      { Cfg.volumeMin }, { Cfg.volumeMin = it }, { "%.3f".format(it) })
                  slider(col, "Exigência de nota clara (menor = aceita mais)", 2f, 15f,
                      { Cfg.tonalidade }, { Cfg.tonalidade = it }, { "%.1f".format(it) })
                  slider(col, "Tolerância de afinação (cents)", 10f, 100f,
                      { Cfg.tolerancia }, { Cfg.tolerancia = it }, { "%.0f".format(it) })
                  slider(col, "Tempo para soltar (ms)", 50f, 800f,
                      { Cfg.soltarMs }, { Cfg.soltarMs = it }, { "%.0f".format(it) })
                  slider(col, "Estabilidade (confirmações antes de apertar)", 1f, 6f,
                      { Cfg.estabilidade }, { Cfg.estabilidade = it }, { "%.0f".format(it) })
                  slider(col, "Afinação (cents)", -100f, 100f,
                      { Cfg.afinacao }, { Cfg.afinacao = it }, { "%+.0f".format(it) })
                  slider(col, "Duração de cada bloco do toque (ms)", 40f, 400f,
                      { Cfg.stepMs }, { Cfg.stepMs = it }, { "%.0f".format(it) })

                  col.addView(CheckBox(this).apply {
                      text = "Apertar de novo ao repetir a mesma nota"
                      setTextColor(Color.WHITE)
                      isChecked = Cfg.retocar
                      setOnCheckedChangeListener { _, v -> Cfg.retocar = v; Cfg.salvar(this@TapService) }
                  })

                  col.addView(Button(this).apply {
                      text = "Calibrar botões (começa em 5 s)"
                      setOnClickListener {
                          hudAberto = false
                          rolagem.visibility = View.GONE
                          startCalibration(5000)
                      }
                  })
                  col.addView(Button(this).apply {
                      text = "Fechar HUD"
                      setOnClickListener { ocultarHud() }
                  })

                  val lp = WindowManager.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = hudX
                      y = hudY
                  }

                  // Arrastar pelo cabeçalho; toque simples abre/fecha o painel
                  var iniX = 0; var iniY = 0; var toqueX = 0f; var toqueY = 0f; var moveu = false
                  cabecalho.setOnTouchListener { _, ev ->
                      when (ev.action) {
                          MotionEvent.ACTION_DOWN -> {
                              iniX = lp.x; iniY = lp.y; toqueX = ev.rawX; toqueY = ev.rawY; moveu = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = ev.rawX - toqueX
                              val dy = ev.rawY - toqueY
                              if (abs(dx) > 12 || abs(dy) > 12) moveu = true
                              if (moveu) {
                                  lp.x = iniX + dx.toInt(); lp.y = iniY + dy.toInt()
                                  hudX = lp.x; hudY = lp.y
                                  wm.updateViewLayout(raiz, lp)
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moveu) {
                                  hudAberto = !hudAberto
                                  rolagem.visibility = if (hudAberto) View.VISIBLE else View.GONE
                              }
                          }
                      }
                      true
                  }

                  wm.addView(raiz, lp)
                  hud = raiz
                  cabTv = cabecalho
                  stTv = st
                  main.post(atualizarHud)
              }
          }
          ARQUIVO_FIM
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          cat > 'app/src/main/res/values/strings.xml' << 'ARQUIVO_FIM'
          <resources>
              <string name="acess_desc">Aperta os botões na tela do emulador quando você toca notas na ocarina.</string>
          </resources>
          ARQUIVO_FIM
          mkdir -p "$(dirname 'app/src/main/res/xml/accessibility_config.xml')"
          cat > 'app/src/main/res/xml/accessibility_config.xml' << 'ARQUIVO_FIM'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:description="@string/acess_desc"
              android:notificationTimeout="100" />
          ARQUIVO_FIM
          mkdir -p "$(dirname 'build.gradle.kts')"
          cat > 'build.gradle.kts' << 'ARQUIVO_FIM'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          ARQUIVO_FIM
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' << 'ARQUIVO_FIM'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=false
          ARQUIVO_FIM
          mkdir -p "$(dirname 'settings.gradle.kts')"
          cat > 'settings.gradle.kts' << 'ARQUIVO_FIM'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OcarinaController"
          include(":app")
          ARQUIVO_FIM

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ocarina-apk
          path: app/build/outputs/apk/debug/app-debug.apk
